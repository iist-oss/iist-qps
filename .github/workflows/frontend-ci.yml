name: Frontend CI
on:
  push: { paths: ['frontend/**', '.github/workflows/frontend-ci.yml'] }
  pull_request: { paths: ['frontend/**'] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install        # first green run: commit the generated package-lock.json, then switch to `npm ci`
      - run: npm test
      - run: npm run build      # tsc --noEmit && vite build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsInJlZiI6ImV4YW1wbGUifQ.ci-placeholder-signature   # fake anon-shaped JWT (ref matches the URL) so the D24 build guard passes

name: Deploy Edge Functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mebfxiizwzzsjuuqftoy
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo "SUPABASE_ACCESS_TOKEN secret not set - skipping deploy (this is not a failure)."
      - if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy approve-paper delete-paper notify-upload daily-digest --project-ref "$PROJECT_REF" --use-api
